# Template for a NEW, isolated beta project. No change to GitHub Pages.
name = "retry-solana-devnet-beta"
pages_build_output_dir = "../../out"
compatibility_date = "2026-10-23"

[[services]]
binding = "METADATA_SERVICE"
service = "retry-metadata-devnet-beta"

# Bind preview deployments too. The public URI must use the stable beta hostname.
[env.preview]
[[env.preview.services]]
binding = "METADATA_SERVICE"
service = "retry-metadata-devnet-beta"
