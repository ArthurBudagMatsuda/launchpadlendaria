packages:
  - .
allowBuilds:
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  bigint-buffer: false
  bufferutil: false
  utf-8-validate: false
  workerd: true
minimumReleaseAgeExclude:
  - jose@6.2.14
  - miniflare@5.20261023.3-beta
  - wrangler@4.156.0
overrides:
  # @meteora-ag/cp-amm-sdk lists "chain" (an unrelated EVM UI kit that pulls
  # wagmi, ethers and React 18) as a dependency but never imports it.
  "@meteora-ag/cp-amm-sdk>chain": "-"
