packages:
  - .
allowBuilds:
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  bigint-buffer: false
  bufferutil: false
  utf-8-validate: false
  workerd: true
minimumReleaseAgeExclude:
  - jose@6.2.14
  - miniflare@5.20261023.3-beta
  - wrangler@4.156.0
overrides:
  # @meteora-ag/cp-amm-sdk lists "chain" (an unrelated EVM UI kit that pulls
  # wagmi, ethers and React 18) as a dependency but never imports it.
  "@meteora-ag/cp-amm-sdk>chain": "-"
  # Targeted compatible API upgrades; no blanket dependency update.
  "@coral-xyz/anchor>toml": "5.0.1"
  "jayson>uuid": "11.1.1"
  # Security updates for lint tooling. React Hooks supports Zod 4; Node 24
  # satisfies minimatch 11. Runtime Meteora dependencies are unchanged.
  "eslint-plugin-react-hooks>zod": "4.6.6"
  "minimatch@10.2.6": "11.0.1"
patchedDependencies:
  bigint-buffer@1.1.5: patches/bigint-buffer@1.1.5.patch
