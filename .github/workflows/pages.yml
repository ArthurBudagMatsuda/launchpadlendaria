name: Publish RETRY test preview
# Publishes the integrated app (Stage 1 + @retry/web3) from main, with the
# Web3 test bench at /web3/. The stage branches keep an older copy of this
# file that publishes the split preview; stop pushing to them once merged.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retry-github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'ArthurBudagMatsuda/launchpadlendaria'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Check application and Web3 module
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm --filter @retry/web3 check
      - name: Build RETRY for Pages
        run: pnpm build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_DEFAULT_NETWORK: base-sepolia
      - name: Build Web3 test bench (developer tool)
        run: pnpm --filter retry-web3-playground build --base=/${{ github.event.repository.name }}/web3/
        env:
          VITE_DEFAULT_NETWORK: base-sepolia
      - name: Combine and record the source commit
        run: |
          mkdir -p out/web3
          cp -R examples/web3-playground/dist/. out/web3/
          printf 'Application and Web3 test bench: %s\n' "$(git rev-parse HEAD)" > out/preview-version.txt
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages bundle
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
