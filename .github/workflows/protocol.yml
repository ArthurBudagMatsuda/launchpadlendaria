name: RETRY protocol specification

on:
  push:
    branches: [feat/retry-protocol-architecture]
  pull_request:
    paths:
      - 'docs/protocol/**'
      - 'packages/protocol-simulator/**'
      - '.github/workflows/protocol.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/protocol-simulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Check documentation, model invariants and committed economic outputs
        run: node scripts/verify.mjs
      - name: Verify checks did not change the checkout
        run: git diff --exit-code
