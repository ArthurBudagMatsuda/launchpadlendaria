name: RETRY Meteora on-chain tests
# Real transactions against Meteora's deployed programs, with test keys only:
#  - validator: a local validator running the exact DBC, DAMM v2, Locker and
#    Metaplex programs cloned from Devnet, and again from Mainnet (read-only
#    copies of the binaries), plus the public DAMM v2 migration config and
#    the DBC pool authority (its SOL is the rent float the migration borrows
#    and repays), so the full flow including graduation runs for free.
#  - devnet: the same flow on Solana Devnet. The public RPC faucet is closed
#    on Devnet, so it needs the RETRY_DEVNET_FUNDER secret: a throwaway test
#    wallet funded at faucet.solana.com. It runs on manual dispatch, or on a
#    push whose commit message contains [devnet].
# Nothing here sends a transaction to Mainnet, touches GitHub Pages, or
# prints a secret.
on:
  push:
    paths:
      - "src/lib/meteora/**"
      - "src/config/retry-protocol.ts"
      - "src/components/launch/**"
      - "tests/chain/**"
      - "e2e/chain/**"
      - "infra/metadata-worker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/meteora-chain.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meteora-chain-${{ github.ref }}
  cancel-in-progress: false
env:
  AGAVE_VERSION: v3.1.10
  DEVNET_RPC: https://api.devnet.solana.com
jobs:
  validator:
    name: Local validator with ${{ matrix.programs }} programs (full flow + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        programs: [devnet, mainnet]
    env:
      CLONE_RPC: ${{ matrix.programs == 'mainnet' && 'https://api.mainnet-beta.solana.com' || 'https://api.devnet.solana.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Agave (solana-test-validator)
        run: |
          curl -sSfL "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" | tar -xj -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Start validator with programs cloned from ${{ matrix.programs }}
        run: |
          APP_CONFIG=""
          if [ "${{ matrix.programs }}" = devnet ]; then
            APP_CONFIG=$(node -e "const s=require('fs').readFileSync('src/config/retry-protocol.ts','utf8');const m=/devnet:\s*\{\s*address:\s*\"(\w+)\"/.exec(s);process.stdout.write(m?m[1]:'')")
          fi
          echo "APP_CONFIG=$APP_CONFIG" >> "$GITHUB_ENV"
          CLONE_CONFIG=""
          if [ -n "$APP_CONFIG" ]; then CLONE_CONFIG="--clone $APP_CONFIG"; fi
          solana-test-validator --reset --quiet --ledger "$RUNNER_TEMP/ledger" --url "$CLONE_RPC" \
            --clone-upgradeable-program dbcij3LWUppWqq96dh6gJWwBifmcGfLSB5D4DuSMaqN \
            --clone-upgradeable-program cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG \
            --clone-upgradeable-program LocpQgucEQHbqNABEYvBvwoxCPsSbG91A1QaQhQQqjn \
            --clone-upgradeable-program metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s \
            --clone Hv8Lmzmnju6m7kcokVKvwqz7QPmdX9XfKjJsXz8RXcjp \
            --maybe-clone FhVo3mqL8PW5pH5U2CN4XE33DokiyZnUwuGpH2hmHLuM \
            $CLONE_CONFIG > "$RUNNER_TEMP/validator.log" 2>&1 &
          for i in $(seq 1 90); do
            if solana -u localhost cluster-version >/dev/null 2>&1; then break; fi
            sleep 2
          done
          solana -u localhost cluster-version
      - name: Record the program binaries under test (Devnet vs Mainnet)
        run: |
          # Program accounts can be allocated larger than the binary, so
          # trailing zero bytes are dropped before hashing.
          digest() { python3 -c "import sys,hashlib;b=open(sys.argv[1],'rb').read().rstrip(b'\0');print(hashlib.sha256(b).hexdigest()+'/'+str(len(b)))" "$1"; }
          for program in dbcij3LWUppWqq96dh6gJWwBifmcGfLSB5D4DuSMaqN cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG LocpQgucEQHbqNABEYvBvwoxCPsSbG91A1QaQhQQqjn; do
            solana -u localhost program dump "$program" "$RUNNER_TEMP/$program.local.so" >/dev/null
            for cluster in devnet mainnet-beta; do
              solana -u "https://api.$cluster.solana.com" program dump "$program" "$RUNNER_TEMP/$program.$cluster.so" >/dev/null || true
            done
            echo "PROGRAM_HASH $program under-test(${{ matrix.programs }})=$(digest "$RUNNER_TEMP/$program.local.so") devnet=$( [ -f "$RUNNER_TEMP/$program.devnet.so" ] && digest "$RUNNER_TEMP/$program.devnet.so" || echo unavailable) mainnet=$( [ -f "$RUNNER_TEMP/$program.mainnet-beta.so" ] && digest "$RUNNER_TEMP/$program.mainnet-beta.so" || echo unavailable)" | tee -a "$GITHUB_STEP_SUMMARY" | sed 's/^/::notice title=Program binary::/'
          done
          # The DBC pool authority lends the rent for the DAMM v2 accounts at
          # graduation and is repaid in the same instruction (flash rent).
          for cluster in localhost https://api.devnet.solana.com https://api.mainnet-beta.solana.com; do
            echo "POOL_AUTHORITY_SOL $cluster $(solana -u "$cluster" balance FhVo3mqL8PW5pH5U2CN4XE33DokiyZnUwuGpH2hmHLuM 2>&1)" | tee -a "$GITHUB_STEP_SUMMARY" | sed 's/^/::notice title=DBC pool authority::/'

          done
      - name: Chain flow (config, launch, trades, graduation, claim)
        run: pnpm test:chain
        env:
          RETRY_CHAIN_MODE: local
          RETRY_CHAIN_USE_APP_CONFIG: ${{ env.APP_CONFIG != '' && '1' || '' }}
          RETRY_CHAIN_EVIDENCE: evidence-validator.json
          RETRY_METADATA_URI: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/meteora/devnet-metadata/retry-devnet-test.json
      - name: Summarize the chain evidence
        if: always()
        run: node tests/chain/summarize-evidence.mjs evidence-validator.json "${{ matrix.programs }} programs"
      - name: Point the test build at the validator's RETRY config
        if: env.APP_CONFIG == ''
        run: node tests/chain/use-validator-config.mjs evidence-validator.json
      - name: Browser flow (launch, buy, sell, portfolio) on the validator
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --config playwright.chain.config.ts
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meteora-validator-${{ matrix.programs }}-evidence
          path: |
            evidence-validator.json
            test-results
          retention-days: 30
  devnet:
    name: Solana Devnet (test wallet)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[devnet]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for the Devnet test wallet
        env:
          HAS_FUNDER: ${{ secrets.RETRY_DEVNET_FUNDER != '' }}
        run: |
          if [ "$HAS_FUNDER" != true ]; then
            echo "::warning::RETRY_DEVNET_FUNDER is not set. The public Devnet RPC faucet is closed (410), so the Devnet steps will be skipped, not faked."
            echo "Devnet steps skipped: add the RETRY_DEVNET_FUNDER secret (see docs/meteora/OPERATIONAL_RUNBOOK.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Chain flow on Devnet (reuses the app's Devnet config when set)
        run: pnpm test:chain
        env:
          RETRY_CHAIN_MODE: devnet
          RETRY_CHAIN_RPC: ${{ env.DEVNET_RPC }}
          RETRY_CHAIN_USE_APP_CONFIG: "1"
          RETRY_CHAIN_EVIDENCE: evidence-devnet.json
          RETRY_DEVNET_FUNDER: ${{ secrets.RETRY_DEVNET_FUNDER }}
          RETRY_METADATA_URI: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/meteora/devnet-metadata/retry-devnet-test.json
      - if: always()
        run: |
          cat evidence-devnet.json || true
          node tests/chain/summarize-evidence.mjs evidence-devnet.json "Devnet"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meteora-devnet-evidence
          path: evidence-devnet.json
          retention-days: 90
