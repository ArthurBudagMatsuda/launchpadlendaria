name: RETRY Web3 module
on:
  push:
    paths:
      - "packages/retry-web3/**"
      - "examples/web3-playground/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/retry-web3.yml"
  pull_request:
    paths:
      - "packages/retry-web3/**"
      - "examples/web3-playground/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/retry-web3.yml"
permissions:
  contents: read
concurrency:
  group: retry-web3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module:
    name: Typecheck, lint, test and build @retry/web3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      # One workspace lockfile for the app, the module and the playground.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @retry/web3 typecheck
      - run: pnpm --filter @retry/web3 lint
      - run: pnpm --filter @retry/web3 test
      - run: pnpm --filter @retry/web3 build
  playground:
    name: Playground build and Playwright (desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter retry-web3-playground typecheck
      - run: pnpm --filter retry-web3-playground exec playwright install --with-deps chromium
      # Builds and serves the playground itself (see playwright.config.ts).
      # The wallet and the Base RPC are simulated; no network access to Base is needed.
      - run: pnpm --filter retry-web3-playground exec playwright test
